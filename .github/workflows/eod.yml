name: End of Day Report

on:
  workflow_run:
    workflows: ["Intraday Scan"]
    types:
      - completed
  workflow_dispatch:

# Grant read access to actions/artifacts so this workflow can download artifacts from the triggering run
permissions:
  actions: read
  contents: read

jobs:
  eod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Debug: show triggering workflow run id"
        run: |
          echo "Triggering workflow run id: ${{ github.event.workflow_run.id }}"
          echo "Triggering workflow run url: ${{ github.event.workflow_run.html_url }}"

      - name: "(Optional) List artifacts on triggering run"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl
          RUN_ID=${{ github.event.workflow_run.id }}
          echo "Listing artifacts for run $RUN_ID"
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            | jq .

      - name: Download intraday signals
        uses: actions/download-artifact@v4
        with:
          name: intraday-signals
          path: data
          run-id: ${{ github.event.workflow_run.id }}

      - name: Run EOD report
        run: |
          python Scripts/eod_report.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
