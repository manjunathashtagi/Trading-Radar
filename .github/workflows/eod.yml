name: EOD Report

on:
  schedule:
    - cron: '30 10 * * 1-5'   # ~4:00 PM IST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          pip install -r requirements.txt
          python Scripts/eod_report.py
