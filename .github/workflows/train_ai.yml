name: Train AI Model

on:
  schedule:
    - cron: "0 3 * * 1-5"   # 08:30 IST (before market)
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -r requirements.txt

      - name: Build Training Data
        run: python Scripts/build_market_training_data.py

      - name: Train AI Model
        run: python Scripts/train_ai_model.py

      - name: Commit AI Model
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/ai_model.pkl || true
          git add data/training_data.csv || true
          git commit -m "Auto: update AI model" || echo "No changes"
          git push