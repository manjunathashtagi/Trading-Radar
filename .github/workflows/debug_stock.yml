name: Debug Stock Signal

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "NSE stock symbol (example: ADANIPOWER)"
        required: true
        default: "ADANIPOWER"

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy ta

      - name: Run diagnostic
        run: |
          python Scripts/debug_stock.py ${{ github.event.inputs.symbol }}