name: Trading Radar – Intraday & EOD

on:
  schedule:
    # Intraday runs every 15 minutes during market hours
    - cron: "*/15 4-9 * * 1-5"     # 09:30–14:30 IST
    # EOD run (market close)
    - cron: "0 10 * * 1-5"        # 15:30 IST

  workflow_dispatch:

permissions:
  contents: read

jobs:
  intraday:
    name: Intraday Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/intraday_scan.py


  eod:
    name: End of Day Report
    runs-on: ubuntu-latest

    # ✅ THIS IS THE ONLY SAFE CONDITION
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EOD report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/eod_report.py