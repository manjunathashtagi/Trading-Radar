name: Trading Radar – Intraday & EOD

on:
  schedule:
    # Intraday: every 15 minutes during market hours (IST 9:15–15:30)
    - cron: "*/15 4-10 * * 1-5"   # UTC → IST approx
    # EOD trigger: once at market close
    - cron: "0 10 * * 1-5"        # 15:30 IST ≈ 10:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  intraday:
    name: Intraday Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/intraday_scan.py

      - name: Upload intraday signals
        uses: actions/upload-artifact@v4
        with:
          name: intraday-signals
          path: data/
          retention-days: 3

  eod:
    name: End of Day Report
    runs-on: ubuntu-latest

    # 🔑 THIS IS THE KEY LINE
    if: github.event.schedule == '0 10 * * 1-5'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download intraday signals
        uses: actions/download-artifact@v4
        with:
          name: intraday-signals
          path: data

      - name: Verify downloaded data
        run: |
          ls -la data || echo "❌ No intraday data"

      - name: Run EOD report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/eod_report.py
