name: Intraday Radar

on:
  schedule:
    # Every 15 minutes, Mon–Fri (IST handled in code)
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    
jobs:
  intraday:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 🔽 Download existing daily ledger (if exists)
      - name: Download trade ledger
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trades-today
          path: data
      - name: Download tradable universe
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tradable-universe
          path: data
            # ▶ Run intraday scan (appends new trades)
      - name: Run intraday scan
        run: |
          python Scripts/intraday_scan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # 🔼 Upload updated daily ledger
      - name: Upload trade ledger
        if: always() && hashFiles('data/trades_today.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trades-today
          path: data/trades_today.csv
