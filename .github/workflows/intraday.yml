name: Trading Radar – Intraday & EOD

on:
  schedule:
    # Intraday: every 15 minutes (IST 9:15–15:15 ≈ UTC 4:00–9:45)
    - cron: "*/15 4-9 * * 1-5"

    # EOD trigger: market close (15:30 IST ≈ 10:00 UTC)
    - cron: "0 10 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  intraday:
    name: Intraday Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/intraday_scan.py


  eod:
    name: End of Day Report
    runs-on: ubuntu-latest

    # Run only on scheduled events (extra safety)
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EOD report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/eod_report.py
