name: Intraday Radar

on:
  schedule:
    - cron: "*/15 4-10 * * 1-5"   # 09:15–15:15 IST
  workflow_dispatch:

jobs:
  intraday:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download tradable universe
        uses: actions/download-artifact@v4
        with:
          name: tradable-universe
          path: data

      - name: Run intraday scan
        run: |
          python Scripts/intraday_scan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload trade ledger
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trades-today
          path: data/trades_today.csv