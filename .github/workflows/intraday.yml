name: Intraday Scanner

on:
  schedule:
    # Runs every 15 min during NSE hours (9:15–15:15 IST = 3:45–9:45 UTC)
    # Cron fires 5 min early so runner is ready at the signal time
    - cron: "0,15,30,45 3-9 * * 1-5"
  workflow_dispatch:

jobs:
  intraday:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Cache pip dependencies — saves 2-4 min per run
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Intraday Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Scripts/run_intraday.py

      - name: Save alerts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/alerted_today.csv data/signals.csv || true
          git commit -m "Intraday update $(date -u +%H:%M)" || echo "No changes"
          git pull origin main --rebase || true
          git push origin main
