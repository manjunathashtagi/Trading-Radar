name: Intraday Scanner

on:
  schedule:
    - cron: "40,45,50,55 3 * * 1-5"
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 4-8 * * 1-5"
    - cron: "0,5,10,15,20,25,30,35,40,45,50 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: intraday-scan
  cancel-in-progress: true

jobs:
  intraday:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Intraday Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Scripts/run_intraday.py

      - name: Save alerts
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/alerted_today.csv data/signals.csv || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Intraday $(date -u +%H:%M)"
          for i in 1 2 3; do
            git pull origin main --rebase && git push origin main && break
            echo "Retry $i..."
            sleep $((i * 5))
          done
