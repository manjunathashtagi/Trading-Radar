name: Trading Radar Full System

on:
  schedule:
    # 🧠 Stage 1 (Full NSE scan) → 9:05 AM IST
    - cron: "35 3 * * 1-5"

    # 🚀 Intraday Sniper → every 5 min (9:15–3:30 IST)
    - cron: "45 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"

    # 📊 EOD Report → 3:35 PM IST
    - cron: "5 10 * * 1-5"

  workflow_dispatch:

jobs:
  trading-system:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # =========================
      # Python setup
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # Stage 1 (Full NSE Scan)
      # =========================
      - name: Run Stage-1 Builder
        run: |
          python Scripts/stage1_builder.py || echo "Stage1 skipped"

      # =========================
      # Intraday Sniper
      # =========================
      - name: Run Intraday Sniper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/run_intraday.py || echo "Intraday skipped"

      # =========================
      # EOD Report
      # =========================
      - name: Run EOD Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/run_eod.py || echo "EOD skipped"

      # =========================
      # Commit & Push (FIXED)
      # =========================
      - name: Commit data safely
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add files
          git add data/*.csv || true

          # Skip if no changes
          git diff --quiet && echo "No changes" && exit 0

          # Commit
          git commit -m "Auto update trading data"

          # Pull safely
          git pull origin main --rebase || true

          # Push
          git push origin main