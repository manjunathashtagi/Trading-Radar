name: Intraday Alpha Scan

on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"   # 09:15–15:45 IST
  workflow_dispatch:

jobs:
  intraday:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Intraday Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/run_intraday.py
      - name: Commit signals file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/signals.csv || true
          git commit -m "Auto: update signals file" || echo "No changes"
          git push