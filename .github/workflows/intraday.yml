name: Trading Radar – Intraday & EOD

on:
  schedule:
    # Intraday runs every 15 minutes (IST market hours approx)
    - cron: "*/15 4-10 * * 1-5"   # UTC ≈ 09:30–15:30 IST

    # EOD trigger (STRICT)
    - cron: "0 10 * * 1-5"        # 15:30 IST

  workflow_dispatch:
    inputs:
      run_eod:
        description: "Force EOD report manually (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  intraday:
    name: Intraday Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/intraday_scan.py

      - name: Upload intraday signals
        uses: actions/upload-artifact@v4
        with:
          name: intraday-signals
          path: data/
          retention-days: 3

  eod:
    name: End of Day Report
    runs-on: ubuntu-latest

    # ✅ STRICT CONDITION (THIS IS THE KEY)
    # Runs ONLY:
    # 1) At scheduled market close (15:30 IST)
    # 2) OR when manually forced with run_eod=true
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * 1-5')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_eod == 'true')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download intraday signals
        uses: actions/download-artifact@v4
        with:
          name: intraday-signals
          path: data

      - name: Run EOD report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/eod_report.py