name: Hybrid Intraday Engine

on:
  schedule:
    - cron: "*/5 4-9 * * 1-5"   # 09:30–14:45 IST
  workflow_dispatch:

jobs:
  intraday:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -r requirements.txt
      - name: Generate training data
        run: |
          python Scripts/generate_training_data.py
      - name: Train AI model
        run: |
          python Scripts/train_ai_model.py

      - name: Run Intraday
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Scripts/run_intraday.py

      - name: Commit Signals
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/signals.csv || true
          git add data/alerted_today.csv || true
          git commit -m "Auto update signals" || echo "No changes"
          git push