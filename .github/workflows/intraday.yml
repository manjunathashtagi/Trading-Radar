name: Intraday + EOD Trading Radar

on:
  schedule:
    # Intraday scan – every 5 minutes (IST ~ market hours)
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  intraday:
    name: Intraday Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run intraday scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/intraday_scanner.py

      - name: Upload intraday signals
        uses: actions/upload-artifact@v4
        with:
          name: intraday-signals
          path: data/
          retention-days: 3

  eod:
    name: End of Day Report
    needs: intraday
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download intraday signals
        uses: actions/download-artifact@v4
        with:
          name: intraday-signals
          path: data

      - name: Verify downloaded data
        run: |
          echo "📂 Data folder:"
          ls -la data || echo "❌ No data folder"

      - name: Run EOD report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/eod_report.py
