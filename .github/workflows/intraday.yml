name: Intraday Scan

on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"   # 09:15–15:45 IST
  workflow_dispatch:

jobs:
  intraday:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1️⃣ Checkout
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------
      # 2️⃣ Python setup
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -----------------------------
      # 3️⃣ Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # 4️⃣ Run intraday scan
      # -----------------------------
      - name: Run intraday scan
        run: |
          python Scripts/intraday_scan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # -----------------------------
      # 5️⃣ Upload intraday signals
      # -----------------------------
      - name: Upload intraday signals
        uses: actions/upload-artifact@v4
        with:
          name: intraday-signals
          path: data/intraday_signals_*.csv
          if-no-files-found: warn