name: Intraday

on:
  schedule:
    # ✅ Runs every 5 min from 09:15 to 15:30 IST
    - cron: "*/5 3-10 * * 1-5"
  
  # ✅ Manual trigger (VERY IMPORTANT)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn requests

      - name: 🚀 Run Intraday Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python Scripts/run_intraday.py

      # ✅ FIXED PUSH ISSUE (VERY IMPORTANT)
      - name: 💾 Commit & Push Data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # ✅ Stage changes FIRST
          git add data/signals.csv || true
          git add data/alerted_today.csv || true

      # ✅ Commit FIRST
          git commit -m "Auto update signals" || echo "No changes"

      # ✅ THEN pull (safe)
          git pull origin main --rebase || true

      # ✅ Push
          git push origin main