name: Premarket Universe Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1-5"   # 09:00 IST

jobs:
  build-universe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Generate NSE master universe
        run: python Scripts/generate_nse_master_universe.py

      - name: Build tradable universe
        run: python Scripts/build_tradable_universe.py
