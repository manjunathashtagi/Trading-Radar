name: Generate NSE Master Universe (One Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pandas

      - name: Generate NSE master universe
        run: python Scripts/generate_nse_master_universe.py

      - name: Commit CSV to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/nse_all_symbols.csv
          git commit -m "Add NSE master universe (~2000 stocks)" || echo "No changes"
          git push