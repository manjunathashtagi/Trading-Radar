name: Premarket Universe Builder

on:
  schedule:
    - cron: "15 1 * * 1-5"   # 06:45 IST
  workflow_dispatch:

jobs:
  build-universe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -r requirements.txt

      # 🔹 Step 1: Generate full NSE universe (~2000)
      - run: python Scripts/generate_nse_all_symbols.py

      # 🔹 Step 2: Apply liquidity filter
      - run: python Scripts/build_tradable_universe.py

      # 🔹 Step 3: Upload tradable universe
      - uses: actions/upload-artifact@v4
        with:
          name: tradable-universe
          path: data/universe_nse_tradable.csv
