name: Premarket Universe Builder

on:
  schedule:
    # 06:45 IST (01:15 UTC), Mon–Fri
    - cron: "15 1 * * 1-5"
  workflow_dispatch:

jobs:
  build-universe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build tradable universe
        run: |
          python Scripts/build_tradable_universe.py

      - name: Upload tradable universe
        uses: actions/upload-artifact@v4
        with:
          name: tradable-universe
          path: data/universe_nse_tradable.csv
